<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html { font-family: Inter; line-height: 1.25; font-optical-sizing: none; }
body { margin: 0; }
.c { margin: 8px; padding: 10px; } 
</style></head>
<body>
<div data-id="r" class="c" style="border: 4px solid #345; border-radius: 12px; background: #fda;">Rounded with border.</div>
<div data-id="mixed" class="c" style="border-top: 6px solid #c00; border-left: 2px dashed #0c0; border-bottom: 1px dotted #00c; background: #eef;">Mixed borders.</div>
<div data-id="circle" style="width: 60px; height: 60px; border-radius: 50%; background: #39c; margin: 8px;"></div>
<div data-id="grad" class="c" style="background: linear-gradient(90deg, #f00, #00f); color: #fff;">Gradient background.</div>
<div data-id="shadow" class="c" style="box-shadow: 4px 4px 6px rgba(0,0,0,0.4); background: #fff;">Box shadow.</div>
</body></html>
