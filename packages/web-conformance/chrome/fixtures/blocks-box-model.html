<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html { font-family: Inter; line-height: 1.25; font-optical-sizing: none; }
body { margin: 0; }
.box { width: 60%; padding: 10px 14px; border: 3px solid #333; margin: 8px auto; } .bb { box-sizing: border-box; } .mw { max-width: 150px; min-height: 40px; }
</style></head>
<body>
<div data-id="b1" class="box">Content box sizing with padding and border.</div>
<div data-id="b2" class="box bb">Border box sizing keeps sixty percent.</div>
<div data-id="b3" class="box mw">Max width and min height.</div>
</body></html>
