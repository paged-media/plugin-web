<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html { font-family: Inter; line-height: 1.25; font-optical-sizing: none; }
body { margin: 0; }
.box { position: absolute; width: 60px; height: 60px; }
</style></head>
<body>
<div data-id="stage" style="position: relative; height: 100px;"><div data-id="a" class="box" style="left: 0; top: 0; background: #f99; z-index: 2;"></div><div data-id="b" class="box" style="left: 30px; top: 20px; background: #99f; z-index: 1;"></div></div>
<div data-id="t" style="transform: translate(10px, 5px);">Transformed text keeps its layout box.</div>
</body></html>
