<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
html { font-family: Inter; line-height: 1.25; font-optical-sizing: none; }
body { margin: 0; }
div { margin-bottom: 8px; }
</style></head>
<body>
<div data-id="pre" style="white-space: pre;">Pre   keeps   spaces
and newlines
    and indentation.</div>
<div data-id="prewrap" style="white-space: pre-wrap;">Pre-wrap   keeps   spaces but still wraps when the line gets too long for the frame width.</div>
<div data-id="nowrap" style="white-space: nowrap;">Nowrap keeps everything on one line even past the edge of the frame.</div>
<div data-id="normal">Normal    collapses
   whitespace    runs.</div>
</body></html>
